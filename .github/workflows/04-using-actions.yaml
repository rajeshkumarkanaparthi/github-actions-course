name: 04-using-actions
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-using-actions/react-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit test
        run: npm test